<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador hidráulico</title>
    <style>
      /* Splash until the app mounts (+layout.ts: no server render). Colours from app.css tokens. */
      body { margin: 0; background: #eef0ee; }
      #splash { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center;
        font: 15px/1.35 system-ui, sans-serif; color: #5f6b76; }
      #splash strong { font-size: 20px; color: #1b2128; }
      #splash .bar { width: 160px; height: 4px; border-radius: 2px; background: #d5dadf; overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #1c7ed6; animation: slide 1.1s ease-in-out infinite alternate; }
      @keyframes slide { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; opacity: 0.4; } }
      @media (prefers-color-scheme: dark) {
        body { background: #12161a; }
        #splash { color: #9aa4ae; }
        #splash strong { color: #e7eaee; }
        #splash .bar { background: #343d47; }
        #splash .bar::after { background: #4dabf7; }
      }
      body:has(.app) #splash { display: none; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash" role="status">
      <strong>Simulador hidráulico</strong>
      <div class="bar"></div>
      <span>Cargando…</span>
      <noscript>Activa JavaScript para usar el simulador.</noscript>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
